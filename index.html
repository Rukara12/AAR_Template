<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 리뷰 템플릿 — 커뮤니티용 이미지 생성기</title>
<meta name="description" content="디시인사이드에 올릴 게임 리뷰 이미지를 카드 단위로 조립해 만드는 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<header id="top">
  <span class="brand">리뷰 템플릿</span>

  <span class="sp"></span>

  <div class="uiscale" role="group" aria-label="화면 크기">
    <button type="button" id="uiDown" class="step" title="화면 작게" aria-label="화면 작게">−</button>
    <button type="button" id="uiLevel" class="level" title="눌러서 기본 크기로 되돌리기">100%</button>
    <button type="button" id="uiUp" class="step" title="화면 크게" aria-label="화면 크게">+</button>
  </div>

  <div class="uiscale" role="group" aria-label="되돌리기">
    <button type="button" id="btnUndo" class="step" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
    <button type="button" id="btnRedo" class="step" title="다시하기 (Ctrl+Shift+Z)" aria-label="다시하기">↷</button>
  </div>

  <span class="vline"></span>
  <button type="button" id="btnMore" class="ghost" aria-haspopup="true">문서 ▾</button>
  <button type="button" id="btnPanel" class="ghost" title="카드 속성 패널 여닫기">속성</button>
  <button type="button" id="btnExport" class="primary">내보내기</button>

  <div id="moreMenu" class="menu" hidden>
    <label class="menu-field">
      <span>톤</span>
      <select id="mTheme"></select>
    </label>
    <hr>
    <button type="button" id="btnNew">새로 시작…</button>
    <button type="button" id="btnShots">스샷 여러 장 넣기…</button>
    <hr>
    <button type="button" id="btnLibrary">보관함…</button>
    <button type="button" id="btnLoad">프로젝트 불러오기</button>
    <button type="button" id="btnSave">프로젝트 저장 (Ctrl+S)</button>
    <hr>
    <button type="button" id="btnHelp">조작법 (?)</button>
  </div>
</header>

<main id="app">

  <div id="left">
    <section id="palette" aria-label="카드 팔레트">
      <h3>카드 팔레트 <span class="beta">실험적</span></h3>
      <div id="ptiles"></div>
      <p class="hint">타일을 아래 <b>문서 구성</b>으로 끌어다 놓으세요. 커서를 올리면 견본이 보입니다.<br>
      손이 많이 간 구성은 <b>리뷰 카드</b> 기본 구성입니다. 카드를 더 넣거나 빼는 것은 아직 다듬는 중입니다.</p>
    </section>

    <section id="rail" aria-label="문서 구성">
      <h3>문서 구성</h3>
      <div id="cardlist"></div>
      <div id="emptyhint">여기로 카드를 끌어다 놓으세요<br>또는 이미지를 창에 떨어뜨리세요</div>
    </section>
  </div>

  <section id="stage" aria-label="미리보기">
    <div id="stageInner"></div>
  </section>

  <section id="insp" aria-label="카드 속성">
    <h3>카드 속성</h3>
    <div id="inspBody"></div>
  </section>

</main>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="projPick" accept="application/json,.json" hidden>

<script type="module" src="./js/main.js"></script>
</body>
</html>
